apiVersion: v1
kind: Pod
metadata:
  name: baseline-web-test
  labels:
    tier: frontend
spec:
  containers:
  - name: nginx-container
    image: docker.io/nginx:alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: html-volume
      mountPath: /usr/share/nginx/html
  volumes:
  - name: html-volume
    configMap:
      name: web-landing-page
