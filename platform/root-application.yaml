apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/iksirlouis'
    targetRevision: HEAD
    path: apps
    directory:
      recurse: false
  destination:
    server: 'https://default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    createNamespace: true
