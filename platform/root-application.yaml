apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/iksirlouis/k8s-platform-lab'
    targetRevision: HEAD
    path: apps
    directory:
      recurse: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
  ignoreDifferences:               # <-- 1. Tell Argo CD to ignore specific shifts
  - group: apps
    kind: Deployment
    jsonPointers:
    - /spec/replicas                # <-- 2. Ignore changes made to the replicas value
